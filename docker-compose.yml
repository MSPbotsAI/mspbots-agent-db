services:
  mspbots-agent-db:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: mspbots-agent-db:latest
    container_name: mspbots-agent-db-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
