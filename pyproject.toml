[project]
name = "mspbots-agent-db"
version = "0.1.0"
description = "MCP server for the MSPbots Agent Data Core (pg-data-ingest) API — schema discovery, filtered queries, single-record read/write/delete, batch writes, and agent listing, scoped to one tenant's business-log data"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
mspbots-agent-db = "mspbots_agent_db.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mspbots_agent_db"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
